; =====================================================================
; ESP32-WROOM (classic ESP32, 4MB flash) + ST7735 160x128 TFT + TF card
; =====================================================================
; Wiring (ST7735) - matches the reference driver (参考驱动.txt):
;   TFT_SCK   = 18
;   TFT_MOSI  = 23
;   TFT_CS    =  5
;   TFT_DC    =  4
;   TFT_RST   = 19
; TF (microSD) card - shares the display's VSPI bus (per 引脚定义.txt):
;   SDCARD_SCK = 18, SDCARD_MOSI = 23, SDCARD_MISO = 19, SDCARD_CS = 22
;   GPIO19 is shared with TFT_RES (time-multiplexed); SD CS is GPIO22.
;   (SDCARD_* lives in boards/esp32-wroom-st7735/pins_arduino.h)
; Buttons (to GND, active LOW):
;   KEY_UP    =  2
;   KEY_DOWN  = 13
;   KEY_LEFT  = 27
;   KEY_RIGHT = 35   (input-only, external pull-up required)
;   KEY_A     = 34   (input-only, external pull-up required)
;   KEY_B     = 12   (BACK/ESC - MTDI strap pin, button to GND only)
;
; Display variant:
;   The panel is a native 128x160 ST7735 shown in landscape (rotation 3
;   -> 160x128; rotation 3 = rotation 1 turned 180 deg because the panel
;   is mounted upside down). If the picture is shifted/has stripes on the
;   edges, try a different tab: ST7735_REDTAB, ST7735_BLACKTAB,
;   ST7735_GREENTAB, ST7735_GREENTAB2 ...
; =====================================================================

[env:esp32-wroom-st7735]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/esp32-wroom-st7735>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/esp32-wroom-st7735

	-DESP32_WROOM_ST7735  ; selects this board from boards/pinouts/pins_arduino.h

	; ---------- TFT_eSPI (ST7735, 160x128 landscape) ----------
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB   ; custom rotation-3 offset is defined in ST7735_Rotation.h
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=128     ; native portrait width
	-DTFT_HEIGHT=160    ; native portrait height
	-DROTATION=3        ; 160x128 landscape. 3 = rotation 1 + 180 deg (the
	                    ; panel is mounted upside down; 1 shows a 180-rotated
	                    ; picture). If the image is mirrored instead, try 1.
	-DTFT_MISO=19       ; VSPI MISO, shared with the TF card. MUST be
	                    ; explicitly defined so TFT_eSPI and SD can share
	                    ; the bus (TFT_eSPI issue #3860). ST7735 is
	                    ; write-only, so MISO is used by the SD card.
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=4
	-DTFT_RST=19
	-DTFT_BL=-1         ; backlight hard-wired on, no GPIO control
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=27000000
	-DSMOOTH_FONT=1

	-DDEVICE_NAME='"ESP32 WROOM ST7735"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}
